version: "3.9"

services:
  pipeline:
    build: .
    volumes:
      - ./data:/app/data
    command: >
      sh -c "
        echo 'Running simulator...' &&
        python simulator/simulator.py &&
        echo 'Running ingest...' &&
        python ingest/ingest.py &&
        echo 'Running scorer...' &&
        python scorer/scorer.py &&
        echo 'Starting dashboard...' &&
        streamlit run dashboard/dashboard.py --server.port 8501 --server.address 0.0.0.0
      "
    ports:
      - "8501:8501"